global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: yimi-api
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/admin-key
    scrape_interval: 30s
    static_configs:
      - targets: ["api-1:8000", "api-2:8000"]
