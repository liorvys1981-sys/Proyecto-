version: 1
provider:
  name: openai
  model: gpt-4o
  tools_enabled: false
agents:
  - id: master_orchestrator
    module: agents.orchestrator.service
    status: implemented
    scope: Durable task queue, single GPT-4o dispatch, six-stage pipeline and decision-event coordination.
  - id: monetization
    module: agents.monetization.token_pricing
    status: implemented
    scope: Local token cost estimation and configurable resale tiers; not an autonomous billing worker.
  - id: devops
    module: monitoring.health
    status: implemented
    scope: Database/queue diagnosis and heartbeat alerts; no autonomous infrastructure changes.
  - id: resources
    module: agents.resources.service
    status: implemented
    scope: Measures worker CPU time and process peak memory for each provider call.
  - id: security
    module: agents.security.service
    status: partial
    scope: Keyword-based high-impact review and no-tools guardrail; not a comprehensive policy engine.
  - id: analytics
    module: agents.analytics.service
    status: partial
    scope: Records goal fingerprint, output length and token signals; no semantic quality or net-profit validation.
